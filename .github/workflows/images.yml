# Build the Smart Motor server images and push them to GitHub Container Registry.
# The VPS only pulls images (scripts/deploy.sh); it never needs the source code.
name: images

on:
  push:
    branches: [main, master]
    paths: ["selink_server/**", "t153_edge/**", ".github/workflows/images.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selink_server/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            selink_server/services/requirements.txt
            selink_server/services/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selink_server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: selink_server/web/package-lock.json
      - run: npm ci
      - run: npm run build

  edge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t153_edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: t153_edge/go.mod
          cache-dependency-path: t153_edge/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build production ARM binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o /tmp/edge-agent ./cmd/edge-agent

  build:
    needs: [backend-tests, web-tests, edge-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: services
            dockerfile: selink_server/services/Dockerfile
          - name: web
            dockerfile: selink_server/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smartmotor/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: selink_server
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
