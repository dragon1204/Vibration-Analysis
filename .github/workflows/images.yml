# Build the Smart Motor server images and push them to GitHub Container Registry.
# The VPS only pulls images (scripts/deploy.sh); it never needs the source code.
name: images

on:
  push:
    branches: [main, master]
    paths: ["selink_server/**", "t153_edge/**", ".github/workflows/images.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selink_server/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            selink_server/services/requirements.txt
            selink_server/services/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selink_server/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: selink_server/web/package-lock.json
      - run: npm ci
      - run: npm run build

  edge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t153_edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: t153_edge/go.mod
          cache-dependency-path: t153_edge/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build production ARM binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o /tmp/edge-agent ./cmd/edge-agent

  build:
    needs: [backend-tests, web-tests, edge-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: services
            dockerfile: selink_server/services/Dockerfile
          - name: web
            dockerfile: selink_server/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smartmotor/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: selink_server
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Every push to main that passes the tests and builds the images is rolled out to the VPS.
  # deploy.sh verifies health and rolls back to the previous tag on failure.
  # Secret: VPS_SSH_KEY (private key whose public half is the forced-command entry for
  # scripts/ci-deploy.sh on the VPS). The VPS host key is public and pinned below.
  deploy:
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: 160.191.87.104
      # /etc/ssh/ssh_host_rsa_key.pub of the VPS (fingerprint SHA256:HDY1mf2N43lEEzHEtHfwy7fBqpV3nkPxIpBjIq9MzLs)
      VPS_HOST_KEY: "160.191.87.104 ssh-rsa "
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          # Strip CR (key pasted from Windows) so OpenSSH accepts it; fail with a clear message.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::VPS_SSH_KEY is not a valid OpenSSH private key"; exit 1; }
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
      - name: Ship host files and deploy ${{ github.sha }}
        working-directory: selink_server
        run: |
          TAG="${GITHUB_SHA::7}"
          tar czf - docker-compose.yml .env.example scripts/*.sh emqx/emqx.conf emqx/acl.conf \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_HOST}" "deploy ${TAG}"
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${VPS_HOST}/api/v1/health" >/dev/null; then echo "API healthy"; exit 0; fi
            sleep 5
          done
          echo "API health check failed" >&2; exit 1
