# T153 "t153-01" – Máy bơm test Trường Giang (site namhong) on the VPS server.
# Install at /etc/edge-agent/edge.yaml with mqtt.token + ca.pem from the server.
version: 1
gateway: {id: t153-01, tenant: hem, site: namhong, timezone: Asia/Ho_Chi_Minh}
mqtt:
  url: mqtts://160.191.87.104:8883
  username: t153-01
  password_file: /etc/edge-agent/mqtt.token
  ca_file: /etc/edge-agent/ca.pem
  send_waveforms: true
# Board eMMC has ~1 GB free (no TF card yet): cap local storage; routine captures
# every 30 s while alarms can still request an immediate capture.
storage: {dir: /data/edge, retention_days: 2, max_bytes: 600000000}
log: {level: info, file: /data/edge/logs/edge-agent.log}
buses:
  # Sensor set to 115200 bps (BAUD code 0x06, saved): one RAWFIFO frame ≈ 0.55 s on the wire.
  - {id: busA, device: /dev/ttyS6, baud: 115200, timeout_ms: 150, raw_timeout_ms: 3000}
# The firmware's B2/VRMS registers are zero in MODE=1 and are not usable.
# Compute the fast RMS every second from a rolling four-frame Welch window.
# At 4 kS/s this represents 4 x 256 ms = 1.024 s of analysed vibration.
# B1 is retained at 500 ms for running/frequency hints without starving RAWFIFO.
# Full FFT captures remain separate and run every 30 seconds.
intervals: {b1_ms: 500, b2_s: 3600, fast_rms_ms: 1000, vib_window_ms: 500, window_s: 2}
machines:
  - id: pump-tg-01
    name: "Máy bơm test Trường Giang"
    type: pump
    rated_power_kw: 550
    rated_speed_rpm: 2800           # theo web; 1X đo được ≈ 49,4 Hz (≈ 2960 v/ph) – kiểm tra lại nhãn
    poles: 2
    line_freq_hz: 50
    iso_group: 1                # khớp với server: nhóm 1 (> 300 kW), nền mềm → A/B 3.5, B/C 7.1, C/D 11 mm/s
    foundation: flexible
    iso_band_hz: [10, 1000]
    points:
      - id: pump-tg-01-p1
        name: "Cảm biến 1"
        location: de
        sensor: {driver: wtvb05, bus: busA, addr: 0x02, velocity_scale: 0.01}
        axes_map: {x: radial_h, y: axial, z: radial_v}
        iso_axes: [x, z]
        # Keep the sensor at 4 kS/s so the 1 s RMS loop does not switch SR or
        # discard FIFO frames. One frame represents 256 ms of vibration.
        idle_sr: 3
        profiles:
          # 4 kS/s keeps the full ISO 10–1000 Hz band inside the validated
          # anti-alias range (fs/2.56 = 1562.5 Hz). At 2 kS/s it was truncated
          # to 781.25 Hz and captures carried the iso_band_truncated flag.
          - {name: orders, sr: 3, frames: 1, every_s: 30}
local_alarm: {enabled: false}
