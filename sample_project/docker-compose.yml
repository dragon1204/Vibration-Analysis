version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123" # HTTP (cho giao diện Web/API)
      - "9000:9000" # Native (cho Backend nối tới)
      - "9009:9009" # Inter-server
    volumes:
      - ch_data:/var/lib/clickhouse # Lưu dữ liệu ra named volume để tránh lỗi permission trên Windows
      - ./docker_volumes/ch_logs:/var/log/clickhouse # Lưu log
      - ./docker_volumes/ch_users/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - ./docker_volumes/redis_data:/data
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-broker
    ports:
      - "1883:1883" # MQTT Port
      - "9001:9001" # Websocket Port
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./docker_volumes/mosquitto_data:/mosquitto/data
      - ./docker_volumes/mosquitto_log:/mosquitto/log
    restart: always

volumes:
  ch_data:
