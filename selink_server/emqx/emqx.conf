## EMQX 5 – Smart Motor broker (spec 6.1, 6.8)
## Gateways connect with TLS on 8883; services use plain 1883 inside the docker network.
## Authentication and ACL are delegated to the API (/api/v1/internal/mqtt/*).

node {
  name = "emqx@127.0.0.1"
  cookie = "smartmotor-emqx-cookie"
  data_dir = "data"
}

cluster {
  name = smartmotor
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10000
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/server.pem"
    keyfile = "/opt/emqx/etc/certs/server.key"
    versions = ["tlsv1.3", "tlsv1.2"]
    verify = verify_none
  }
}

listeners.ws.default.enable = false
listeners.wss.default.enable = false

mqtt {
  max_packet_size = 4MB
  session_expiry_interval = 7d
  max_mqueue_len = 10000
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://api:8000/api/v1/internal/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers { "content-type" = "application/json" }
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  # disconnect (not ignore): a denied QoS1 publish is then never PUBACKed, so the edge keeps it
  # in its outbox and retries – no silent data loss while the API restarts.
  deny_action = disconnect
  cache {
    enable = true
    max_size = 128
    ttl = 1m
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://api:8000/api/v1/internal/mqtt/acl"
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      headers { "content-type" = "application/json" }
      request_timeout = "5s"
    },
    {
      # Fallback when the API is unreachable (HTTP source returns "ignore").
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
