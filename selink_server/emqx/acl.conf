%% Fallback ACL used when the HTTP authorizer (API) is unreachable – same topic policy (spec 6.8).
%% The ingest service user authenticates as superuser and bypasses authorization.
%% Tenant/site of each gateway is additionally verified by ingest (spec 6.3 step 2).
{deny, all, publish, ["sm/v1/+/+/${username}/cmd", "sm/v1/+/+/${username}/config"]}.
{allow, all, publish, ["sm/v1/+/+/${username}/#"]}.
{allow, all, subscribe, ["sm/v1/+/+/${username}/cmd", "sm/v1/+/+/${username}/config"]}.
{deny, all}.
